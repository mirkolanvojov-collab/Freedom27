name: Tests

on:
  push:
    branches: [main, research/cve-source-reconciliation-2026-10-24]
  pull_request:
    branches: [main, research/cve-source-reconciliation-2026-10-24]

permissions:
  contents: read

concurrency:
  group: freedom27-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Apple's live OTA metadata for the fixed reference
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm blacktop/ipsw:latest download ota --platform ios --device iPhone17,4 --build 23H30 --urls | tee /tmp/fixed-ota-urls.txt
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          lines = [x.strip() for x in Path('/tmp/fixed-ota-urls.txt').read_text().splitlines() if x.strip()]
          urls = [x for x in lines if x.startswith('https://')]
          valid = [u for u in urls if urlparse(u).hostname == 'updates.cdn-apple.com']
          if not valid:
              raise SystemExit("Apple live OTA metadata returned no direct Apple CDN URL for iPhone17,4 build 23H30; do not guess one.")
          print("Validated Apple CDN URL(s):")
          for url in valid:
              print(url)
          PY
      - name: Compile all Python source and test files
        run: python -m compileall -q Framework tests research/scripts

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate iOS 26.7 advisory candidate metadata
        run: python -m Framework.advisory_candidates
      - name: Audit candidate IDs against primary Apple advisories
        run: python -m Framework.advisory_source_audit
      - name: Check evidence metadata integrity
        run: python -m Framework.evidence_checks
      - name: Check exact-target compatibility claim evidence
        run: python -m Framework.claim_checks
      - name: Check project metadata integrity
        run: python -c "from Framework.project_checks import check_project; errors = check_project(); print('\\n'.join(errors) if errors else 'Project metadata checks passed'); raise SystemExit(bool(errors))"
      - name: Check exploit-chain evidence readiness
        run: python -m Framework.chain_readiness
      - name: Validate fail-closed device safety preflight
        run: python -c "import json; from Framework.device_safety_gate import assess_safety; from pathlib import Path; t=json.loads(Path('research/current_exact_target_status.json').read_text()); a=json.loads(Path('research/device_safety_attestations.json').read_text()); r=assess_safety(t,a); print(json.dumps(r, indent=2)); assert r['preflight_passed'] is False; assert r['device_execution_authorized'] is False; assert r['guarantees_no_crash'] is False; assert r['blocker_count'] > 0"
      - name: Generate evidence-first blocker analysis
        run: python -m Framework.blocker_analyzer > research/blocker_report.json && python -c "import json; d=json.load(open('research/blocker_report.json', encoding='utf-8')); assert d['assessment'] == 'blocked' or d['verified_complete_jailbreak']; assert d['device_modified'] is False; print('Blocker report validated:', d['blocker_count'], 'blockers')"
      - name: Generate blocker-resolution plan
        run: python -m Framework.blocker_resolution_engine > research/blocker_resolution_report.json && python -c "import json; d=json.load(open('research/blocker_resolution_report.json', encoding='utf-8')); assert d['assessment'] == 'blocked' or d['verified_complete_jailbreak']; assert d['execution_policy']['device_modified'] is False; assert d['execution_policy']['exploit_execution_authorized'] is False; print('Blocker-resolution report validated:', d['open_task_count'], 'open tasks')"
      - name: Generate read-only iOS security audit
        run: python -m Framework.ios_security_audit > research/ios_security_audit_report.json && python -c "import json; d=json.load(open('research/ios_security_audit_report.json', encoding='utf-8')); assert d['mode'] == 'read_only_defensive_audit'; assert d['device_modified'] is False; assert d['bypass_attempted'] is False; print('Security audit report validated:', d['controls_reviewed'], 'controls')"
      - name: Run research triage report
        run: python -m Framework.research_triage
      - name: Validate machine-readable research triage output
        run: python -m Framework.research_triage --json > research/triage_report.json && python -c "import json; d=json.load(open('research/triage_report.json', encoding='utf-8')); assert d['summary']['joined_entries'] == d['summary']['registry_entries'] == d['summary']['ledger_entries']; assert d['summary']['reproduced_by_freedom27'] == 0; print('Research triage report validated')"
      - name: Run unified read-only research engine
        run: python -m Framework.universal_research_engine --output research/unified_research_report.json
      - name: Validate unified research report
        run: python -c "import json; d=json.load(open('research/unified_research_report.json', encoding='utf-8')); assert d['mode'] == 'read_only_advisory_and_evidence_triage'; assert d['summary']['device_modified'] is False; assert d['summary']['exploit_executed'] is False; assert d['assessment'] == 'blocked'; print('Unified research report validated')"
      - name: Validate source-pinned research manifest
        run: python -m Framework.research_manifest
