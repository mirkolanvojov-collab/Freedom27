name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check project metadata integrity
        run: python -c "from Framework.project_checks import check_project; errors = check_project(); print('\n'.join(errors) if errors else 'Project metadata checks passed'); raise SystemExit(bool(errors))"
