name: Acquire 23H24 OTA and record integrity

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/acquire-23h24-ota.yml
  push:
    branches:
      - research/cve-source-reconciliation-2026-10-24
    paths:
      - .github/workflows/acquire-23h24-ota.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Resolve direct Apple CDN source
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm blacktop/ipsw:latest download ota --platform ios --device iPhone17,4 --build 23H24 --json > candidates.json 2> discovery-stderr.txt
          # The live Pallas feed may no longer advertise historical builds.
          # Query AppleDB metadata as an independent fallback, without downloading.
          docker run --rm blacktop/ipsw:latest download appledb --os iOS --type ota --device iPhone17,4 --build 23H24 --json > appledb.json 2> appledb-stderr.txt || echo '{"schema_version":1,"releases":[]}' > appledb.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          expected = "9fa3dca87b9d18a7329eada91fcd038086f20c37e1aed47f8735f0970b27cd14.aea"
          live = json.loads(Path("candidates.json").read_text())
          historical = json.loads(Path("appledb.json").read_text())
          if live.get("schema_version") != 1 or not isinstance(live.get("otas"), list):
              raise SystemExit("Unexpected live OTA metadata schema")
          if historical.get("schema_version") != 1 or not isinstance(historical.get("releases"), list):
              raise SystemExit("Unexpected historical OTA metadata schema")
          candidates = []
          for entry in live["otas"]:
              if entry.get("build") == "23H24":
                  candidates.append((entry.get("url"), "live"))
          for release in historical["releases"]:
              if release.get("build") != "23H24":
                  continue
              for artifact in release.get("artifacts", []):
                  if artifact.get("source_type") == "ota" and "iPhone17,4" in artifact.get("devices", []):
                      candidates.append((artifact.get("active_url"), "historical"))
          matches = set()
          for url, source in candidates:
              if not isinstance(url, str):
                  continue
              parsed = urlparse(url)
              if parsed.scheme == "https" and parsed.hostname == "updates.cdn-apple.com" and unquote(parsed.path.rsplit("/", 1)[-1]) == expected:
                  matches.add(url)
          status = "source_not_advertised"
          if len(matches) == 1:
              Path("apple-url.txt").write_text(next(iter(matches)) + "\n")
              status = "source_found"
          elif len(matches) > 1:
              raise SystemExit("Ambiguous Apple CDN URLs for exact requested archive")
          Path("23H24-discovery-record.txt").write_text(
              f"live_ota_count={len(live['otas'])}\n"
              f"historical_release_count={len(historical['releases'])}\n"
              f"matching_exact_apple_urls={len(matches)}\n"
              f"discovery_status={status}\n"
              "verification_scope=metadata discovery only; no archive authenticity inferred\n"
          )
          print(Path("23H24-discovery-record.txt").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"source_found={'true' if status == 'source_found' else 'false'}", file=output)
          PY
      - name: Explain unavailable historical OTA
        if: steps.resolve.outputs.source_found != 'true'
        run: echo 'No exact Apple CDN archive found in either metadata source; do not download or claim authentication.'
      - name: Download and hash archive without installing or extracting
        if: steps.resolve.outputs.source_found == 'true'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          url="$(cat apple-url.txt)"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 3300 --output 23H24.aea "$url"
          bytes="$(stat -c '%s' 23H24.aea)"
          test "$bytes" -gt 8000000000
          test "$bytes" -lt 9500000000
          digest="$(sha256sum 23H24.aea | cut -d ' ' -f 1)"
          printf 'device=iPhone17,4\nbuild_requested=23H24\nsource_host=updates.cdn-apple.com\nfilename=9fa3dca87b9d18a7329eada91fcd038086f20c37e1aed47f8735f0970b27cd14.aea\nsize_bytes=%s\nobserved_sha256=%s\nverification_scope=transport_and_observed_digest_only; no independent trusted SHA256 available\n' "$bytes" "$digest" > 23H24-integrity-record.txt
          cat 23H24-integrity-record.txt
          rm -f 23H24.aea
      - name: Upload small integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-23H24-observed-integrity
          path: |
            23H24-integrity-record.txt
            23H24-discovery-record.txt
          if-no-files-found: warn
