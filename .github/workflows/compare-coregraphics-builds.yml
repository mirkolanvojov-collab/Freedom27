      - name: Resolve and download iOS 26.7 OTA for direct patch attribution
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p out/26.7-ota diagnostics
          {
            echo "stage=resolve_23H24_ota"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Resolve the direct URL from live OTA metadata; never synthesize an Apple CDN path.
            if ! ipsw download ota --platform ios --device iPhone17,4 --build 23H24 --urls 2>&1 | tee diagnostics/ios-26.7-23H24-ota-metadata.txt; then
              echo "Live OTA metadata lookup failed; continue to bounded catalog fallback."
            fi
            python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import subprocess

          lines = [line.strip() for line in Path("diagnostics/ios-26.7-23H24-ota-metadata.txt").read_text().splitlines() if line.strip()]
          urls = [line for line in lines if line.startswith("https://") and urlparse(line).hostname == "updates.cdn-apple.com"]
          if not urls:
              # Apple may stop listing an older full OTA in current live metadata.
              # Fall back to a catalog redirect, then accept only the final Apple CDN URL.
              resolver = "https://api.applesn.info/v4/ota/download/iPhone17%2C4/23H24"
              # /dev/null discards the response body but does not prevent curl from
              # downloading the full OTA. Request only one byte and enforce a hard timeout.
              try:
                  result = subprocess.run(
                      ["curl", "--fail", "--location", "--silent", "--show-error",
                       "--range", "0-0", "--output", "/dev/null",
                       "--write-out", "%{url_effective}", "--max-time", "30", resolver],
                      check=False, capture_output=True, text=True, timeout=35,
                  )
              except (OSError, subprocess.TimeoutExpired) as exc:
                  result = None
                  print(f"bounded_catalog_fallback_unavailable={type(exc).__name__}: {exc}")
              candidate = result.stdout.strip() if result is not None else ""
              if result is not None and result.returncode == 0 and urlparse(candidate).scheme == "https" and urlparse(candidate).hostname == "updates.cdn-apple.com":
                  urls = [candidate]
                  Path("diagnostics/ios-26.7-23H24-ota-metadata.txt").write_text(
                      Path("diagnostics/ios-26.7-23H24-ota-metadata.txt").read_text()
                      + "\nresolver_source=" + resolver + "\nresolved_apple_cdn_url=" + candidate + "\n",
                      encoding="utf-8",
                  )
                  print(f"fallback_catalog_resolved_apple_cdn_url={candidate}")
          if not urls:
              Path("ios-26.7-23H24-ota-unavailable.txt").write_text(
                  "Neither live ipsw metadata nor the catalog redirect resolved an Apple CDN URL for iPhone17,4 build 23H24.\n",
                  encoding="utf-8",
              )
              print("direct_patch_attribution_status=unavailable_no_verified_apple_cdn_url")
              raise SystemExit(0)
          Path("ios-26.7-23H24-ota-url.txt").write_text(urls[0] + "\n", encoding="utf-8")
          print(f"validated_apple_cdn_url={urls[0]}")
          PY
            if [ ! -f ios-26.7-23H24-ota-url.txt ]; then
              echo "Skipping optional 23H24 direct patch-attribution comparison; primary 23G83-to-23H30 comparison can continue."
              exit 0
            fi
            ota_url="$(cat ios-26.7-23H24-ota-url.txt)"
            ota_file="$PWD/ios-26.7-23H24-iPhone17,4.aea"
            curl --fail --location --show-error --continue-at - --retry 10 --retry-all-errors --connect-timeout 30 --max-time 2550 --output "$ota_file" "$ota_url"
            actual_size="$(stat -f '%z' "$ota_file")"
            echo "download_size_bytes=$actual_size"
            test "$actual_size" -eq 8724152320
            actual_sha256="$(shasum -a 256 "$ota_file" | awk '{print $1}')"
            echo "download_sha256=$actual_sha256"
            echo "digest_kind=locally_computed_sha256_not_published_apple_checksum"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } 2>&1 | tee diagnostics/ios-26.7-23H24-ota-download.log

