name: Compare CoreGraphics across target and fixed iOS builds

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/compare-coregraphics-builds.yml"

permissions:
  contents: read

jobs:
  compare:
    # OTA cryptex patching requires macOS on iOS 16+.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Install ipsw
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly trust the upstream tap formula dependency required by ipsw.
          brew trust --formula blacktop/tap/ipsw-frida
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Extract target and fixed dyld caches
        shell: bash
        timeout-minutes: 100
        run: |
          set -euo pipefail
          mkdir -p out/target out/fixed
          target_url='https://updates.cdn-apple.com/2026SummerFCS/fullrestores/140-75160/D83A8969-3179-4D59-9F72-37FFC825CD9A/iPhone17,4_26.6.1_23G83_Restore.ipsw'
          # The target is a restore IPSW; remote extraction is supported directly.
          ipsw extract --dyld --dyld-arch arm64e --device iPhone17,4 --remote --output out/target "$target_url"

          # Apple OTA metadata is intermittently unreachable from CI, so pin the
          # previously verified device/build URL and key. Validate the complete
          # download before extraction; use the OTA-specific parser (not IPSW ZIP parsing).
          ota_url='https://updates.cdn-apple.com/2026FallFCS/5ef51a7b-0f58-4585-8cdf-14afa18e9622/com_apple_MobileAsset_SoftwareUpdate/818080afd3f2204f9cf3c8da075752ee6e05c420554a0b076e7c9f5d2378d203.aea'
          ota_file="$PWD/fixed-23H30-iPhone17,4.aea"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 3000 --output "$ota_file" "$ota_url"
          test "$(stat -f '%z' "$ota_file")" -eq 8724152320
          actual_sha256="$(shasum -a 256 "$ota_file" | awk '{print $1}')"
          test "$actual_sha256" = '0078dc02b647fbc5c6efb8fd4e3fe0fc79d02af5f798f2e7981e069bd6987d92'
          mkdir -p out/fixed-cache
          ipsw ota extract --key-val 'YSWzwfZFdAFfs7gP222NfRfnN9lb1riyeL3bzwMlkEs=' "$ota_file" --dyld --dyld-arch arm64e --output out/fixed-cache --json > out/fixed-ota-extraction.json
          cat out/fixed-ota-extraction.json

          find out/target out/fixed-cache -type f -name 'dyld_shared_cache_arm64e' -print

      - name: Extract CoreGraphics and record comparison metadata
        shell: bash
        run: |
          set -euo pipefail
          target_cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          fixed_cache="$(find out/fixed-cache -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          test -n "$target_cache"
          test -n "$fixed_cache"

          # Once both caches exist, component extraction and metadata comparison
          # are performed by the reusable tool; no second firmware download.
          python3 research/scripts/compare_coregraphics.py \
            --target-cache "$target_cache" \
            --fixed-cache "$fixed_cache" \
            --output coregraphics-comparison.json

          # Keep only the compact evidence record as the artifact.
          rm -rf out coregraphics-comparison-components fixed-23H30-iPhone17,4.aea

      - name: Upload comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: coregraphics-build-comparison
          path: coregraphics-comparison.json
          if-no-files-found: error
