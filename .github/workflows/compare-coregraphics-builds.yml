name: Compare CoreGraphics across target and fixed iOS builds

on:
  workflow_dispatch:
  push:
    branches: [research/cve-source-reconciliation-2026-10-24]
    paths:
      - ".github/workflows/compare-coregraphics-builds.yml"
      - "research/scripts/compare_coregraphics.py"
      - "research/scripts/compare_coregraphics_functions.py"
      - "research/scripts/verify_coregraphics_constants.py"
      - "research/scripts/analyze_coregraphics_conversion_cfg.py"
      - "tests/test_compare_coregraphics_functions.py"
      - "tests/test_verify_coregraphics_constants.py"
      - "tests/test_analyze_coregraphics_conversion_cfg.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/compare-coregraphics-builds.yml"
      - "research/scripts/compare_coregraphics.py"
      - "research/scripts/compare_coregraphics_functions.py"
      - "research/scripts/verify_coregraphics_constants.py"
      - "research/scripts/analyze_coregraphics_conversion_cfg.py"
      - "tests/test_compare_coregraphics_functions.py"
      - "tests/test_verify_coregraphics_constants.py"
      - "tests/test_analyze_coregraphics_conversion_cfg.py"

permissions:
  contents: read

concurrency:
  group: coregraphics-build-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    # OTA cryptex patching requires macOS on iOS 16+.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ipsw
        shell: bash
        run: |
          set -euo pipefail
          brew trust --formula blacktop/tap/ipsw-frida
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Extract target dyld cache (iOS 26.6.1 / 23G83)
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p out/target diagnostics
          target_url='https://updates.cdn-apple.com/2026SummerFCS/fullrestores/140-75160/D83A8969-3179-4D59-9F72-37FFC825CD9A/iPhone17,4_26.6.1_23G83_Restore.ipsw'
          {
            echo "stage=target_dyld_extraction"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=$(sw_vers -productVersion)"
            ipsw extract --dyld --dyld-arch arm64e --device iPhone17,4 --remote --output out/target "$target_url"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            find out/target -type f -name 'dyld_shared_cache_arm64e' -print
          } 2>&1 | tee diagnostics/target-extraction.log
          test -n "$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"

      - name: Download and verify fixed-build OTA
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p out diagnostics
          ota_url='https://updates.cdn-apple.com/2026FallFCS/5ef51a7b-0f58-4585-8cdf-14afa18e9622/com_apple_MobileAsset_SoftwareUpdate/818080afd3f2204f9cf3c8da075752ee6e05c420554a0b076e7c9f5d2378d203.aea'
          ota_file="$PWD/fixed-23H30-iPhone17,4.aea"
          {
            echo "stage=fixed_ota_download_and_verification"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            curl --fail --location --show-error --retry 5 --retry-all-errors --connect-timeout 30 --max-time 2550 --output "$ota_file" "$ota_url"
            actual_size="$(stat -f '%z' "$ota_file")"
            echo "download_size_bytes=$actual_size"
            test "$actual_size" -eq 8724152320
            actual_sha256="$(shasum -a 256 "$ota_file" | awk '{print $1}')"
            echo "download_sha256=$actual_sha256"
            test "$actual_sha256" = '0078dc02b647fbc5c6efb8fd4e3fe0fc79d02af5f798f2e7981e069bd6987d92'
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } 2>&1 | tee diagnostics/fixed-ota-download.log

      - name: Extract fixed dyld cache (iOS 26.7.1 / 23H30)
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p out/fixed-cache diagnostics
          ota_file="$PWD/fixed-23H30-iPhone17,4.aea"
          {
            echo "stage=fixed_ota_dyld_extraction"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ipsw ota extract --key-val 'YSWzwfZFdAFfs7gP222NfRfnN9lb1riyeL3bzwMlkEs=' "$ota_file" --dyld --dyld-arch arm64e --output out/fixed-cache --json > out/fixed-ota-extraction.json
            cat out/fixed-ota-extraction.json
            find out/fixed-cache -type f -name 'dyld_shared_cache_arm64e' -print
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } 2>&1 | tee diagnostics/fixed-ota-extraction.log
          test -n "$(find out/fixed-cache -type f -name 'dyld_shared_cache_arm64e' -print -quit)"

      - name: Extract CoreGraphics and compare function instructions
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo "stage=coregraphics_comparison"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            target_cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
            fixed_cache="$(find out/fixed-cache -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
            test -n "$target_cache"
            test -n "$fixed_cache"

            python3 research/scripts/compare_coregraphics.py \
              --target-cache "$target_cache" \
              --fixed-cache "$fixed_cache" \
              --output coregraphics-comparison.json

            target_binary="coregraphics-comparison-components/target/CoreGraphics"
            fixed_binary="coregraphics-comparison-components/fixed/CoreGraphics"
            test -f "$target_binary"
            test -f "$fixed_binary"

            # Preserve symbol and Mach-O function-start metadata for diagnosing
            # symbols that ipsw cannot disassemble. These are read-only reports.
            ipsw macho info --symbols "$target_binary" > diagnostics/target-coregraphics-symbols.txt
            ipsw macho info --symbols "$fixed_binary" > diagnostics/fixed-coregraphics-symbols.txt
            otool -l "$target_binary" > diagnostics/target-coregraphics-load-commands.txt
            otool -l "$fixed_binary" > diagnostics/fixed-coregraphics-load-commands.txt

            # Static comparison only; neither binary is executed.
            # Let ipsw resolve the exact function extent from Mach-O metadata.
            python3 research/scripts/compare_coregraphics_functions.py \
              --target-binary "$target_binary" \
              --fixed-binary "$fixed_binary" \
              --target-load-commands diagnostics/target-coregraphics-load-commands.txt \
              --fixed-load-commands diagnostics/fixed-coregraphics-load-commands.txt \
              --output coregraphics-function-diff.json

            # Capture bounded disassembly for the known direct-reference candidates.
            # This is a read-only supplement to the symbol-scoped aa_* comparison.
            for side in target fixed; do
              if [ "$side" = target ]; then binary="$target_binary"; else binary="$fixed_binary"; fi
              for symbol in _aa_path_iterate _RIPRenderRectangles _ripr_path_fill _ripr_stroke_iterate; do
                report="diagnostics/${side}-caller-${symbol#_}.txt"
                if ipsw macho disass --force --symbol "$symbol" "$binary" > "$report" 2>&1; then
                  echo "caller_disassembly_status=success side=$side symbol=$symbol"
                else
                  echo "caller_disassembly_status=unavailable side=$side symbol=$symbol"
                fi
              done
            done
            # The local/private _process_path_element.15286 name is absent from
            # the Mach-O symbol table; capture a small target-side window around
            # the recorded callsite without assuming it is a stable symbol.
            if ipsw macho disass --force --vaddr 0x1846952c4 --count 16 "$target_binary" \
              > diagnostics/target-process-path-element-callsite.txt 2>&1; then
              echo "local_caller_context_status=captured"
            else
              echo "local_caller_context_status=unavailable"
            fi

            # Verify constants from the fixed binary against the public patch analysis.
            python3 research/scripts/verify_coregraphics_constants.py \
              --binary "$fixed_binary" \
              --load-commands diagnostics/fixed-coregraphics-load-commands.txt \
              --function-diff coregraphics-function-diff.json \
              --output coregraphics-constant-validation.json

            # Reconstruct direct-branch CFGs and report structural dominators.
            python3 research/scripts/analyze_coregraphics_conversion_cfg.py \
              --function-diff coregraphics-function-diff.json \
              --output coregraphics-conversion-cfg-audit.json

            # Shared-cache xref parsing has timed out on this runner and is
            # not required to generate the verified binary/function comparison.
            # Caller discovery is intentionally kept out of this critical path;
            # use the preserved comparison artifacts and separate bounded tooling.
            echo "caller_xref_status=deferred_experimental_shared_cache_scan"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } 2>&1 | tee diagnostics/coregraphics-comparison.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coregraphics-comparison-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload comparison evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coregraphics-build-comparison
          path: |
            coregraphics-comparison.json
            coregraphics-function-diff.json
            coregraphics-constant-validation.json
            coregraphics-conversion-cfg-audit.json
          if-no-files-found: error

      - name: Remove downloaded firmware and extracted binaries
        if: always()
        shell: bash
        run: |
          rm -rf out coregraphics-comparison-components fixed-23H30-iPhone17,4.aea
