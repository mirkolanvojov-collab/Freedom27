name: Compare CoreGraphics across target and fixed iOS builds

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/compare-coregraphics-builds.yml"
      - "research/scripts/verify_restore_manifest.py"
      - "tests/test_verify_restore_manifest.py"
      - "research/scripts/compare_coregraphics.py"
      - "tests/test_compare_coregraphics.py"
      - "research/scripts/compare_coregraphics_functions.py"
      - "research/scripts/verify_coregraphics_constants.py"
      - "research/scripts/compare_coordinate_safety_limit.py"
      - "tests/test_compare_coordinate_safety_limit.py"
      - "research/scripts/analyze_coregraphics_conversion_cfg.py"
      - "tests/test_compare_coregraphics_functions.py"
      - "tests/test_verify_coregraphics_constants.py"
      - "tests/test_analyze_coregraphics_conversion_cfg.py"

permissions:
  contents: read

# Keep only the newest PR comparison active. Older runs use large firmware downloads
# and can otherwise leave stale pending work competing with the current commit.
concurrency:
  group: coregraphics-build-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    # OTA cryptex patching requires macOS on iOS 16+. Use the Intel
    # macOS 15 pool (14 GB RAM) for the multi-GB OTA/dyld extraction job.
    # The firmware being analyzed remains arm64e; host architecture is not target architecture.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ipsw
        shell: bash
        run: |
          set -euo pipefail
          brew trust --formula blacktop/tap/ipsw-frida
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Resolve exact target-device restore image (iOS 26.6.1 / 23G83)
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p out/target diagnostics
          # Resolve the restore URL from the live IPSW catalog for exact hardware/build.
          ipsw download ipsw --device iPhone17,4 --build 23G83 --urls 2>&1 | tee diagnostics/target-ipsw-metadata.txt
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse

          metadata = Path("diagnostics/target-ipsw-metadata.txt").read_text(encoding="utf-8")
          urls = []
          for line in metadata.splitlines():
              for token in line.split():
                  candidate = token.strip("(),'")
                  parsed = urlparse(candidate)
                  if (parsed.scheme == "https"
                          and parsed.hostname == "updates.cdn-apple.com"
                          and candidate.endswith(".ipsw")
                          and "iPhone17,4_26.6.1_23G83_Restore.ipsw" in parsed.path):
                      urls.append(candidate)
          if not urls:
              raise SystemExit("No exact iPhone17,4 / 23G83 Apple CDN restore URL returned by live catalog")
          url = urls[0]
          Path("target-ipsw-url.txt").write_text(url + "\n", encoding="utf-8")
          print("selected_device=iPhone17,4")
          print("selected_build=23G83")
          print(f"validated_target_restore_url={url}")
          PY

      - name: Extract and verify target restore BuildManifest (iOS 26.6.1 / 23G83)
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p out/target-manifest out/target-restore diagnostics
          # Download the separate manifest first, then the complete exact-device
          # restore image. The verifier binds them byte-for-byte and hashes the
          # full IPSW before any target dyld extraction.
          ipsw download ipsw --device iPhone17,4 --build 23G83 --pattern 'BuildManifest[.]plist$' --output out/target-manifest --confirm 2>&1 | tee diagnostics/target-buildmanifest-extraction.log
          manifest="$(find out/target-manifest -type f -name 'BuildManifest.plist' -print -quit)"
          test -n "$manifest"
          echo "disk_before_full_restore_download:"
          df -h
          ipsw download ipsw --device iPhone17,4 --build 23G83 --output out/target-restore --confirm 2>&1 | tee diagnostics/target-full-ipsw-download.log
          ipsw_file="$(find out/target-restore -type f -name '*.ipsw' -print -quit)"
          test -n "$ipsw_file"
          echo "restore_ipsw_file=$ipsw_file"
          python3 research/scripts/verify_restore_manifest.py --manifest "$manifest" --ipsw "$ipsw_file" --product-type iPhone17,4 --product-version 26.6.1 --build 23G83 --output diagnostics/target-restore-manifest-verification.json
          echo "manifest_catalog_selection=device:iPhone17,4 build:23G83"
          echo "manifest_file=$manifest"
          echo "restore_image_file=$ipsw_file"

      - name: Extract target dyld cache (iOS 26.6.1 / 23G83)
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          mkdir -p out/target diagnostics
          ipsw_file="$(find out/target-restore -type f -name '*.ipsw' -print -quit)"
          test -n "$ipsw_file"
          {
            echo "stage=target_dyld_extraction_from_verified_local_restore_image"
            echo "device=iPhone17,4"
            echo "build=23G83"
            echo "restore_image_file=$ipsw_file"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            ipsw extract --dyld --dyld-arch arm64e --device iPhone17,4 --output out/target "$ipsw_file"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            find out/target -type f -name 'dyld_shared_cache_arm64e' -print
            test -n "$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
            echo "target_restore_image_sha256=$(python3 -c 'import json; print(json.load(open("diagnostics/target-restore-manifest-verification.json"))["restore_image"]["sha256"])')"
            echo "target_restore_image_size_bytes=$(python3 -c 'import json; print(json.load(open("diagnostics/target-restore-manifest-verification.json"))["restore_image"]["size_bytes"])')"
          } 2>&1 | tee diagnostics/target-extraction.log
          # Delete only after successful extraction from the verified local image.
          rm -f "$ipsw_file"
          rmdir out/target-restore 2>/dev/null || true
          echo "disk_after_target_restore_cleanup:"
          df -h

      - name: Preserve target dyld-cache provenance and available inspection commands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          test -n "$cache"
          {
            echo "build=23G83"
            echo "device=iPhone17,4"
            echo "cache_filename=$(basename "$cache")"
            echo "cache_size_bytes=$(stat -f '%z' "$cache")"
            echo "cache_sha256=$(shasum -a 256 "$cache" | awk '{print $1}')"
            echo "cache_file_type=$(file -b "$cache")"
            echo "scope=cache_identity_only; no executable linkage or runtime invocation established"
          } > diagnostics/target-dyld-cache-provenance.txt
          ipsw dyld --help > diagnostics/ipsw-dyld-inspection-help.txt 2>&1 || true
          cat diagnostics/target-dyld-cache-provenance.txt

      - name: Inventory all target dyld cache components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path("out/target")
          files=sorted(p for p in root.rglob("*") if p.is_file() and p.name.startswith("dyld_shared_cache_arm64e"))
          if not files:
              raise SystemExit("No arm64e cache components found")
          report={"device":"iPhone17,4","build":"23G83","scope":"extracted cache component inventory only; no executable linkage or runtime execution","components":[]}
          for p in files:
              digest=hashlib.sha256()
              with p.open("rb") as stream:
                  for chunk in iter(lambda:stream.read(8*1024*1024),b""):
                      digest.update(chunk)
              report["components"].append({"relative_path":str(p.relative_to(root)),"size_bytes":p.stat().st_size,"sha256":digest.hexdigest()})
          report["total_component_bytes"]=sum(x["size_bytes"] for x in report["components"])
          Path("diagnostics/target-dyld-cache-components.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({"component_count":len(files),"total_component_bytes":report["total_component_bytes"]},indent=2))
          PY
          ipsw dyld imports --help > diagnostics/ipsw-dyld-imports-help.txt 2>&1 || true

      - name: Inspect target CoreGraphics reverse dylib dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          test -n "$cache"
          # Read-only query. Retain the entire split cache set beside the main cache.
          # Command failures are preserved in diagnostics and fail the step.
          if ipsw dyld imports "$cache" CoreGraphics > diagnostics/target-coregraphics-imports.txt 2> diagnostics/target-coregraphics-imports-stderr.txt; then
            echo "query_exit_status=0" > diagnostics/target-coregraphics-imports-status.txt
          else
            code=$?
            echo "query_exit_status=$code" > diagnostics/target-coregraphics-imports-status.txt
            echo "CoreGraphics reverse-dependency query failed with status $code" >&2
            exit "$code"
          fi
          {
            echo "build=23G83"
            echo "device=iPhone17,4"
            echo "query=ipsw dyld imports <DSC> CoreGraphics"
            echo "scope=static reverse dylib dependencies; not process identity or execution"
            echo "stdout_bytes=$(wc -c < diagnostics/target-coregraphics-imports.txt | tr -d ' ')"
          } > diagnostics/target-coregraphics-imports-provenance.txt

      - name: Inspect selected target imported bind symbols
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          test -n "$cache"
          # This is static Mach-O bind metadata, not runtime call evidence.
          python3 - <<'PY'
          import json
          from pathlib import Path
          targets = [
              "/System/Library/Frameworks/QuartzCore.framework/QuartzCore",
              "/System/Library/Frameworks/CoreText.framework/CoreText",
              "/System/Library/Frameworks/ImageIO.framework/ImageIO",
              "/System/Library/PrivateFrameworks/UIKitCore.framework/UIKitCore",
              "/System/Library/Frameworks/WebKit.framework/WebKit",
          ]
          Path("diagnostics/target-import-bind-images.json").write_text(json.dumps(targets,indent=2)+"\n")
          PY
          while IFS= read -r image; do
            name="$(basename "$image")"
            if ipsw dyld imports "$cache" --image "$image" > "diagnostics/target-bind-${name}.txt" 2> "diagnostics/target-bind-${name}-stderr.txt"; then
              echo "$name success" >> diagnostics/target-bind-status.txt
            else
              code=$?
              echo "$name failed_exit_$code" >> diagnostics/target-bind-status.txt
            fi
          done < <(python3 -c 'import json; print("\n".join(json.load(open("diagnostics/target-import-bind-images.json"))))')
          echo "Static imported-bind inspection; failures recorded individually; no runtime attribution." > diagnostics/target-bind-scope.txt

      - name: Summarize target imported bind symbol evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          names = ("QuartzCore", "CoreText", "ImageIO", "UIKitCore", "WebKit")
          report = {"build":"23G83","device":"iPhone17,4","scope":"static imported-symbol names only; no provider or runtime attribution","images":[]}
          status = Path("diagnostics/target-bind-status.txt").read_text().splitlines()
          statuses = dict(line.split(" ", 1) for line in status if " " in line)
          for name in names:
              path = Path(f"diagnostics/target-bind-{name}.txt")
              lines = [x.strip() for x in path.read_text(errors="replace").splitlines() if x.strip()] if path.exists() else []
              symbols = [x for x in lines if x.startswith("_")]
              cg = [x for x in symbols if "CoreGraphics" in x]
              aa = [x for x in symbols if "_aa_" in x]
              report["images"].append({"image":name,"query_status":statuses.get(name,"missing"),"nonempty_lines":len(lines),"symbol_like_lines":len(symbols),"literal_coregraphics_matches":len(cg),"literal_aa_matches":len(aa),"coregraphics_examples":cg[:10],"aa_examples":aa[:10]})
          Path("diagnostics/target-bind-summary.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Audit imported CoreGraphics API symbol families
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          names = ("QuartzCore", "CoreText", "ImageIO", "UIKitCore", "WebKit")
          # These public API prefixes are lexical hints, not proof of a dylib provider.
          prefixes = ("_CG", "_CGBitmap", "_CGContext", "_CGPath", "_CGImage", "_CGColor")
          result = {"build":"23G83","scope":"lexical imported symbol family counts; provider and call-target unresolved","images":[]}
          for name in names:
              p = Path(f"diagnostics/target-bind-{name}.txt")
              lines = [x.strip() for x in p.read_text(errors="replace").splitlines() if x.startswith("_")]
              matches = [x for x in lines if x.startswith(prefixes)]
              result["images"].append({"image":name,"cg_prefix_matches":len(matches),"cg_prefix_examples":matches[:20],"unique_cg_prefix_matches":len(set(matches))})
          Path("diagnostics/target-cg-api-symbol-families.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Inspect target CoreGraphics export names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          test -n "$cache"
          # Record CLI capabilities first; do not assume export subcommand syntax.
          ipsw dyld --help > diagnostics/target-dyld-command-help.txt 2>&1
          if ipsw dyld macho --help > diagnostics/target-dyld-macho-help.txt 2>&1; then
            echo "macho_help=available" > diagnostics/target-export-inspection-status.txt
          else
            echo "macho_help=unavailable" > diagnostics/target-export-inspection-status.txt
          fi
          echo "Export-provider attribution is pending CLI capability review; no runtime inference." > diagnostics/target-export-inspection-scope.txt
          echo "=== dyld command help (first 100 lines) ==="
          sed -n '1,100p' diagnostics/target-dyld-command-help.txt
          echo "=== dyld macho help (first 100 lines) ==="
          sed -n '1,100p' diagnostics/target-dyld-macho-help.txt
          cat diagnostics/target-export-inspection-status.txt

      - name: Probe target CoreGraphics Mach-O symbol table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          test -n "$cache"
          image="/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics"
          if ipsw dyld macho "$cache" "$image" --symbols > diagnostics/target-coregraphics-macho-symbols.txt 2> diagnostics/target-coregraphics-macho-symbols-stderr.txt; then
            echo "symbols_query=success" > diagnostics/target-coregraphics-macho-status.txt
          else
            code=$?
            echo "symbols_query=failed_exit_$code" > diagnostics/target-coregraphics-macho-status.txt
          fi
          if ipsw dyld macho "$cache" "$image" --loads > diagnostics/target-coregraphics-macho-loads.txt 2> diagnostics/target-coregraphics-macho-loads-stderr.txt; then
            echo "loads_query=success" >> diagnostics/target-coregraphics-macho-status.txt
          else
            code=$?
            echo "loads_query=failed_exit_$code" >> diagnostics/target-coregraphics-macho-status.txt
          fi
          cat diagnostics/target-coregraphics-macho-status.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path("diagnostics/target-coregraphics-macho-symbols.txt")
          lines=p.read_text(errors="replace").splitlines() if p.exists() else []
          for term in ("_CGContext", "_CGPath", "_aa_"):
              hits=[line for line in lines if term in line]
              print(f"coregraphics_symbol_table_term={term} matches={len(hits)}")
              for line in hits[:5]:
                  print(line[:300])
          PY

      - name: Summarize target CoreGraphics symbol ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          path=Path("diagnostics/target-coregraphics-macho-symbols.txt")
          status=Path("diagnostics/target-coregraphics-macho-status.txt").read_text()
          if "symbols_query=success" not in status:
              raise SystemExit("Cannot summarize failed symbol query")
          lines=path.read_text(errors="replace").splitlines()
          groups={"aa_internal":[],"CGContext":[],"CGPath":[]}
          for line in lines:
              m=re.search(r"^\s*(0x[0-9a-fA-F]+):\s+.*?\t([^\t]+)",line)
              if not m:
                  continue
              address,symbol=m.group(1),m.group(2).strip()
              if symbol.startswith("_aa_"): groups["aa_internal"].append({"address":address,"symbol":symbol})
              if symbol.startswith("_CGContext"): groups["CGContext"].append({"address":address,"symbol":symbol})
              if symbol.startswith("_CGPath"): groups["CGPath"].append({"address":address,"symbol":symbol})
          report={"build":"23G83","image":"/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics","scope":"symbol presence and image ownership only; no call edges or runtime attribution","groups":groups}
          out=Path("diagnostics/target-coregraphics-symbol-ownership.json")
          out.write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({"counts":{k:len(v) for k,v in groups.items()},"aa_examples":groups["aa_internal"][:10],"scope":report["scope"]},indent=2))
          PY

      - name: Inspect dyld disassembly options for call-path analysis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          ipsw dyld disass --help > diagnostics/target-dyld-disass-help.txt 2>&1
          ipsw dyld a2f --help > diagnostics/target-dyld-a2f-help.txt 2>&1
          echo "=== disassembly help ==="
          sed -n '1,110p' diagnostics/target-dyld-disass-help.txt
          echo "=== address-to-function help ==="
          sed -n '1,90p' diagnostics/target-dyld-a2f-help.txt
          echo "Read-only CLI capability inspection; no call-edge or exploitability inference." > diagnostics/target-callpath-inspection-scope.txt

      - name: Collect bounded target CoreGraphics call-site disassembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/target-call-sites
          cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          test -n "$cache"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("diagnostics/target-call-sites/README.txt")
          p.write_text("Read-only bounded disassembly. Branch tokens are syntactic candidates only; no interprocedural call edges are established by this report.\n")
          PY
          for entry in 'aa_moveto:0x18430a5bc' 'aa_lineto:0x18430ab5c' 'aa_render:0x18430c5e8'; do
            label="${entry%%:*}"
            addr="${entry#*:}"
            if ipsw dyld disass "$cache" --vaddr "$addr" --count 96 --quiet > "diagnostics/target-call-sites/${label}.txt" 2> "diagnostics/target-call-sites/${label}.stderr"; then
              echo "${label}=success"
            else
              echo "${label}=failed"
            fi
          done
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          base=Path("diagnostics/target-call-sites")
          result={}
          for p in sorted(base.glob("*.txt")):
              if p.name=="README.txt":continue
              lines=p.read_text(errors="replace").splitlines()
              branches=[s[:250] for s in lines if re.search(r"\b(?:bl|blr|br)\b",s,re.I)]
              result[p.stem]={"lines":len(lines),"branch_syntax_matches":len(branches),"examples":branches[:12],"stderr":(base/(p.stem+".stderr")).read_text(errors="replace")[:1000]}
          (base/"summary.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps({k:{"lines":v["lines"],"branch_syntax_matches":v["branch_syntax_matches"],"stderr":v["stderr"][:120]} for k,v in result.items()},indent=2))
          PY

      - name: Probe public CoreGraphics drawing entrypoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/public-drawing-probes
          cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          test -n "$cache"
          image="/System/Library/Frameworks/CoreGraphics.framework/CoreGraphics"
          for symbol in _CGContextDrawPath _CGContextFillPath _CGContextStrokePath _CGPathApply; do
            if ipsw dyld disass "$cache" --symbol "$symbol" --symbol-image "$image" --count 128 --quiet > "diagnostics/public-drawing-probes/${symbol}.txt" 2> "diagnostics/public-drawing-probes/${symbol}.stderr"; then
              echo "public_symbol_probe=${symbol} status=success"
            else
              code=$?
              echo "public_symbol_probe=${symbol} status=failed_exit_${code}"
            fi
          done
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          base=Path("diagnostics/public-drawing-probes")
          summary={}
          for p in sorted(base.glob("*.txt")):
              lines=p.read_text(errors="replace").splitlines()
              # Report syntax only; do not infer destination ownership from printed names.
              branches=[line.strip()[:300] for line in lines if re.search(r"\b(?:bl|blr|br)\b",line,re.I)]
              summary[p.stem]={"output_lines":len(lines),"branch_syntax_matches":len(branches),"branch_examples":branches[:15],"stderr":(base/(p.stem+".stderr")).read_text(errors="replace")[:1000]}
          (base/"summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print(json.dumps({k:{"output_lines":v["output_lines"],"branch_syntax_matches":v["branch_syntax_matches"],"stderr":v["stderr"][:120]} for k,v in summary.items()},indent=2))
          PY

      - name: Classify public drawing branch destinations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          base=Path("diagnostics/public-drawing-probes")
          ownership=Path("diagnostics/target-coregraphics-symbol-ownership.json")
          symbols=json.loads(ownership.read_text())["groups"]
          by_addr={}
          for group,entries in symbols.items():
              for entry in entries:
                  by_addr.setdefault(int(entry["address"],16),[]).append({"symbol":entry["symbol"],"group":group})
          # Only classify instruction lines with a recognizable mnemonic field.
          # A register target cannot be resolved by static immediate matching.
          branch_re=re.compile(r"\b(bl|blr|br|b(?:\.[a-z]+)?)\s+([^\s,;]+)",re.I)
          address_re=re.compile(r"^(?:#)?(0x[0-9a-f]+)$",re.I)
          report={"scope":"bounded 128-instruction public entrypoint windows; direct immediate targets resolved only against three selected symbol families","functions":{}}
          for p in sorted(base.glob("*.txt")):
              rows=[]
              for line in p.read_text(errors="replace").splitlines():
                  m=branch_re.search(line)
                  if not m:continue
                  mnemonic,operand=m.group(1).lower(),m.group(2)
                  entry={"instruction":line.strip()[:400],"mnemonic":mnemonic,"operand":operand}
                  if mnemonic in ("blr","br") or re.fullmatch(r"[wx][0-9]+",operand,re.I):
                      entry["classification"]="indirect_register_unresolved"
                  elif (a:=address_re.match(operand)):
                      addr=int(a.group(1),16)
                      entry["target_address"]=hex(addr)
                      entry["known_symbols"]=by_addr.get(addr,[])
                      entry["classification"]="direct_known_symbol" if entry["known_symbols"] else "direct_address_unresolved_symbol"
                  else:
                      entry["classification"]="operand_unparsed"
                  rows.append(entry)
              counts={}
              for row in rows:counts[row["classification"]]=counts.get(row["classification"],0)+1
              report["functions"][p.stem]={"counts":counts,"branches":rows}
          out=base/"branch-destination-classification.json"
          out.write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({name:data["counts"] for name,data in report["functions"].items()},indent=2))
          print("Classification is syntactic; no cross-function reachability or exploitability is inferred.")
          PY

      - name: Audit branch classifier against raw disassembly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          base=Path("diagnostics/public-drawing-probes")
          old=json.loads((base/"branch-destination-classification.json").read_text())["functions"]
          report={}
          # The previous regex searched anywhere in a line. This audit retains
          # every candidate for manual review rather than certifying call edges.
          for p in sorted(base.glob("*.txt")):
              lines=p.read_text(errors="replace").splitlines()
              previous=old[p.stem]["branches"]
              counts={"bl_direct_call":0,"blr_indirect_call":0,"br_indirect_jump":0,"b_direct_jump":0,"b_conditional_jump":0,"other_or_unverified":0}
              samples={k:[] for k in counts}
              for item in previous:
                  mnemonic=item["mnemonic"]
                  if mnemonic=="bl": kind="bl_direct_call"
                  elif mnemonic=="blr": kind="blr_indirect_call"
                  elif mnemonic=="br": kind="br_indirect_jump"
                  elif mnemonic=="b": kind="b_direct_jump"
                  elif mnemonic.startswith("b."): kind="b_conditional_jump"
                  else: kind="other_or_unverified"
                  counts[kind]+=1
                  if len(samples[kind])<8:samples[kind].append(item["instruction"])
              report[p.stem]={"previous_candidate_count":len(previous),"candidate_instruction_types":counts,"examples":samples,"raw_disassembly_first_lines":lines[:8],"known_symbol_candidate_examples":[x for x in previous if x["classification"]=="direct_known_symbol"][:12]}
          (base/"branch-parser-audit.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({k:{"previous_candidate_count":v["previous_candidate_count"],"candidate_instruction_types":v["candidate_instruction_types"],"known_symbol_candidate_examples":v["known_symbol_candidate_examples"]} for k,v in report.items()},indent=2))
          print("Audit is a reclassification of prior regex candidates, NOT independent validation of instruction boundaries or target reachability.")
          PY

      - name: Validate direct-call instruction encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          base=Path("diagnostics/public-drawing-probes")
          prior=json.loads((base/"branch-destination-classification.json").read_text())["functions"]
          # ipsw output: 0xADDRESS:  XX XX XX XX   bl<TAB>0xTARGET
          instruction=re.compile(r"^\s*(0x[0-9a-f]+):\s+((?:[0-9a-f]{2}\s+){4})\s*(bl)\s+(0x[0-9a-f]+)(?:\s|$)",re.I)
          report={"method":"independent AArch64 BL immediate encoding verification of previously identified lines","functions":{}}
          for name,data in sorted(prior.items()):
              verified=[];rejected=[]
              for row in data["branches"]:
                  if row["mnemonic"]!="bl":continue
                  line=row["instruction"]
                  m=instruction.match(line)
                  if not m:
                      rejected.append({"line":line,"reason":"instruction_format_unrecognized"})
                      continue
                  pc=int(m.group(1),16)
                  raw=bytes.fromhex(m.group(2))
                  word=int.from_bytes(raw,"little")
                  if word>>26!=0b100101:
                      rejected.append({"line":line,"reason":"encoding_not_BL"})
                      continue
                  imm=word&0x3ffffff
                  if imm&(1<<25):imm-=1<<26
                  computed=(pc+(imm<<2))&((1<<64)-1)
                  printed=int(m.group(4),16)
                  if computed!=printed:
                      rejected.append({"line":line,"reason":"computed_target_mismatch","computed":hex(computed),"printed":hex(printed)})
                      continue
                  verified.append({"source":hex(pc),"target":hex(computed),"known_symbols":row.get("known_symbols",[]),"encoding":raw.hex()})
              report["functions"][name]={"verified_bl":verified,"rejected_bl":rejected,"verified_count":len(verified),"rejected_count":len(rejected)}
          (base/"verified-direct-calls.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({name:{"verified_count":v["verified_count"],"rejected_count":v["rejected_count"],"known_symbol_targets":[x for x in v["verified_bl"] if x["known_symbols"]]} for name,v in report["functions"].items()},indent=2))
          if any(v["rejected_count"] for v in report["functions"].values()):
              raise SystemExit("Direct-call validation found mismatches; inspect verified-direct-calls.json")
          print("All parsed BL immediate encodings match displayed targets; this does not establish further call-chain reachability.")
          PY

      - name: Inventory unresolved verified direct-call destinations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from collections import Counter,defaultdict
          from pathlib import Path
          base=Path("diagnostics/public-drawing-probes")
          data=json.loads((base/"verified-direct-calls.json").read_text())["functions"]
          unresolved=defaultdict(list)
          known=[]
          for function,entry in data.items():
              for call in entry["verified_bl"]:
                  record={"caller_window":function,"source":call["source"],"target":call["target"]}
                  if call["known_symbols"]:
                      known.append({**record,"symbols":call["known_symbols"]})
                  else:
                      unresolved[call["target"]].append(record)
          inventory={"scope":"verified BL calls within four bounded public function windows","verified_calls":sum(x["verified_count"] for x in data.values()),"known_symbol_calls":len(known),"unresolved_call_occurrences":sum(map(len,unresolved.values())),"distinct_unresolved_targets":len(unresolved),"known":known,"unresolved_targets":[{"target":addr,"occurrences":len(records),"call_sites":records} for addr,records in sorted(unresolved.items(),key=lambda x:(-len(x[1]),int(x[0],16)))]}
          (base/"direct-call-target-inventory.json").write_text(json.dumps(inventory,indent=2)+"\n")
          print(json.dumps({k:inventory[k] for k in ("verified_calls","known_symbol_calls","unresolved_call_occurrences","distinct_unresolved_targets")},indent=2))
          print("Top unresolved targets:",json.dumps(inventory["unresolved_targets"][:12],indent=2))
          print("Unresolved means not in the selected symbol-family inventory, not necessarily an unknown function.")
          PY

      - name: Resolve verified call destinations with dyld a2f
        shell: bash
        run: |
          set -euo pipefail
          cache="$(find out/target -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          test -n "$cache"
          export CACHE="$cache"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          base=Path("diagnostics/public-drawing-probes")
          inventory=json.loads((base/"direct-call-target-inventory.json").read_text())
          results=[]
          for item in inventory["unresolved_targets"]:
              addr=item["target"]
              p=subprocess.run(["ipsw","dyld","a2f",os.environ["CACHE"],addr,"--json"],capture_output=True,text=True,timeout=90)
              results.append({"target":addr,"occurrences":item["occurrences"],"exit_code":p.returncode,"stdout":p.stdout[:4000],"stderr":p.stderr[:1000]})
          (base/"unresolved-a2f-results.json").write_text(json.dumps(results,indent=2)+"\n")
          print(json.dumps(results,indent=2))
          print("Address-to-function results require interpretation; lookup does not establish reachability beyond the verified direct call.")
          PY

      - name: Download and verify fixed-build OTA
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p out diagnostics
          ota_url='https://updates.cdn-apple.com/2026FallFCS/5ef51a7b-0f58-4585-8cdf-14afa18e9622/com_apple_MobileAsset_SoftwareUpdate/818080afd3f2204f9cf3c8da075752ee6e05c420554a0b076e7c9f5d2378d203.aea'
          ota_file="$PWD/fixed-23H30-iPhone17,4.aea"
          {
