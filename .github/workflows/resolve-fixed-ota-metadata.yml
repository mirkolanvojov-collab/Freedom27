name: Resolve fixed OTA metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/resolve-fixed-ota-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve iPhone17,4 build 23H30 from OTA catalogue API
        shell: bash
        run: |
          set -euo pipefail
          url='https://ipsw.info/api/v1/ota/iPhone17%2C4/23H30'
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors "$url" -o ota.json
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path("ota.json").read_text())
          if isinstance(data, list):
              matches = [x for x in data if x.get("identifier") == "iPhone17,4" and x.get("buildid") == "23H30"]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one exact OTA match, got {len(matches)}")
              item = matches[0]
          elif isinstance(data, dict):
              item = data
          else:
              raise SystemExit("Unexpected API response root")
          if item.get("identifier") != "iPhone17,4" or item.get("buildid") != "23H30":
              raise SystemExit("Device/build identity mismatch")
          if item.get("version") != "26.7.1":
              raise SystemExit(f"Unexpected OS version: {item.get('version')!r}")
          if item.get("filesize") != 8724152320:
              raise SystemExit(f"Catalogue size mismatch: {item.get('filesize')!r}")
          download = item.get("url")
          parsed = urlparse(download or "")
          if parsed.scheme != "https" or parsed.hostname != "updates.cdn-apple.com":
              raise SystemExit(f"Refusing non-Apple CDN URL: {download!r}")
          # Do not download the 8.7 GB package in this metadata-resolution job.
          print(json.dumps({
              "identifier": item["identifier"],
              "version": item["version"],
              "buildid": item["buildid"],
              "filesize": item["filesize"],
              "url": download,
              "signed": item.get("signed"),
              "sha1": item.get("sha1"),
              "sha256": item.get("sha256"),
              "encryption": item.get("encryption"),
          }, indent=2))
          PY
          cat ota.json
