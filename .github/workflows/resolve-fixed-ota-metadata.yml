name: Resolve fixed OTA metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/resolve-fixed-ota-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Query Apple's live OTA metadata
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/blacktop/ipsw/cmd/ipsw@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          ipsw download ota --platform ios --device iPhone17,4 --build 23H30 --urls | tee ota-urls.txt
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          lines = [x.strip() for x in Path("ota-urls.txt").read_text().splitlines() if x.strip()]
          urls = [x for x in lines if x.startswith("https://")]
          valid = [u for u in urls if urlparse(u).hostname == "updates.cdn-apple.com"]
          if not valid:
              raise SystemExit("Apple live OTA metadata returned no direct Apple CDN URL for iPhone17,4 build 23H30; do not guess one.")
          print("Validated Apple CDN URL(s):")
          for url in valid:
              print(url)
          PY
