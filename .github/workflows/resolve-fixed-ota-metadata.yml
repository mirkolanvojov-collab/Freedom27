name: Resolve fixed OTA metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/resolve-fixed-ota-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query Apple's live OTA metadata
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm blacktop/ipsw:latest download ota --platform ios --device iPhone17,4 --build 23H30 --urls | tee ota-urls.txt
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          lines = [x.strip() for x in Path("ota-urls.txt").read_text().splitlines() if x.strip()]
          urls = [x for x in lines if x.startswith("https://")]
          valid = [u for u in urls if urlparse(u).hostname == "updates.cdn-apple.com"]
          if not valid:
              raise SystemExit("Apple live OTA metadata returned no direct Apple CDN URL for iPhone17,4 build 23H30; do not guess one.")
          print("Validated Apple CDN URL(s):")
          for url in valid:
              print(url)
          Path("fixed-ota-url.txt").write_text(valid[0] + "\\n")
          PY
      - name: Download OTA and verify exact size plus SHA-256
        shell: bash
        timeout-minutes: 50
        run: |
          set -euo pipefail
          url="$(cat fixed-ota-url.txt)"
          curl --fail --location --retry 3 --retry-all-errors --output fixed-ota.aea "$url"
          actual_size="$(stat -c '%s' fixed-ota.aea)"
          expected_size=8724152320
          test "$actual_size" -eq "$expected_size"
          actual_sha256="$(sha256sum fixed-ota.aea | cut -d ' ' -f 1)"
          printf 'url=%s\\nsize_bytes=%s\\nsha256=%s\\n' "$url" "$actual_size" "$actual_sha256" | tee fixed-ota-verification.txt
          # Keep only the small verification record; the 8.7 GB package is not uploaded as an artifact.
          rm -f fixed-ota.aea
      - name: Upload OTA verification record
        uses: actions/upload-artifact@v4
        with:
          name: fixed-ota-verification-23H30
          path: fixed-ota-verification.txt
          if-no-files-found: error
