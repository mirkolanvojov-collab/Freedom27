name: Resolve fixed OTA metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/resolve-fixed-ota-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Query Apple's live OTA metadata
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm blacktop/ipsw:latest download ota --platform ios --device iPhone17,4 --build 23H30 --urls | tee ota-urls.txt
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          lines = [x.strip() for x in Path("ota-urls.txt").read_text().splitlines() if x.strip()]
          urls = [x for x in lines if x.startswith("https://")]
          valid = [u for u in urls if urlparse(u).hostname == "updates.cdn-apple.com"]
          if not valid:
              raise SystemExit("Apple live OTA metadata returned no direct Apple CDN URL for iPhone17,4 build 23H30; do not guess one.")
          print("Validated Apple CDN URL(s):")
          for url in valid:
              print(url)
          Path("fixed-ota-url.txt").write_text(valid[0] + "\n")
          PY
      - name: Download OTA with ipsw client and verify exact size plus SHA-256
        shell: bash
        timeout-minutes: 50
        run: |
          set -euo pipefail
          package="$PWD/fixed-ota.aea"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 3000 \
            --output "$package" "$(cat fixed-ota-url.txt)"
          actual_size="$(stat -c '%s' "$package")"
          expected_size=8724152320
          expected_sha256=0078dc02b647fbc5c6efb8fd4e3fe0fc79d02af5f798f2e7981e069bd6987d92
          test "$actual_size" -eq "$expected_size"
          actual_sha256="$(sha256sum "$package" | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$expected_sha256"
          printf 'url=%s\nsize_bytes=%s\nexpected_sha256=%s\nsha256=%s\n' "$(cat fixed-ota-url.txt)" "$actual_size" "$expected_sha256" "$actual_sha256" | tee fixed-ota-verification.txt
          rm -f "$package"
      - name: Upload OTA verification record
        uses: actions/upload-artifact@v4
        with:
          name: fixed-ota-verification-23H30
          path: fixed-ota-verification.txt
          if-no-files-found: error
