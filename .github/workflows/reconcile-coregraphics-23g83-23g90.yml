name: Reconcile local restore CoreGraphics for 23G83 and 23G90

on:
  push:
    branches:
      - research/cve-source-reconciliation-2026-10-24
    paths:
      - ".github/workflows/reconcile-coregraphics-23g83-23g90.yml"
      - "research/scripts/verify_restore_manifest.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-coregraphics-23g83-23g90.yml"
      - "research/scripts/verify_restore_manifest.py"

permissions:
  contents: read

concurrency:
  group: coregraphics-restore-reconciliation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ipsw
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          brew trust --formula blacktop/tap/ipsw-frida
          brew install blacktop/tap/ipsw
          ipsw version | tee diagnostics-ipsw-version.txt

      - name: Download, checksum, and verify both exact-device restore images
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          mkdir -p out/23G83 out/23G90 manifests diagnostics
          for build in 23G83 23G90; do
            ipsw download ipsw --device iPhone17,4 --build "$build" --output "out/$build" --confirm 2>&1 | tee "diagnostics/$build-download.log"
            image="$(find "out/$build" -type f -name '*.ipsw' -print -quit)"
            test -n "$image"
            python3 - "$image" "$build" <<'PY'
          import hashlib, json, plistlib, sys, zipfile
          from pathlib import Path
          image = Path(sys.argv[1])
          build = sys.argv[2]
          expected = {
              "23G83": ("101aed9c3d5513b598a2b22da7bda5843a051adbe0430f23faed546c1613bd0f", "26.6.1"),
              "23G90": ("3c8d4bb6bfe6273ea297c2571e0108e196ef0e1da28c6c98dd268d35a4527480", "26.6.2"),
          }
          digest_obj = hashlib.sha256()
          with image.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest_obj.update(chunk)
          digest = digest_obj.hexdigest()
          expected_digest, version = expected[build]
          if digest != expected_digest:
              raise SystemExit(f"{build} IPSW SHA-256 mismatch: {digest}")
          with zipfile.ZipFile(image) as archive:
              raw = archive.read("BuildManifest.plist")
          manifest = plistlib.loads(raw)
          if manifest.get("ProductVersion") != version or manifest.get("ProductBuildVersion") != build:
              raise SystemExit(f"{build} embedded BuildManifest identity mismatch")
          if "iPhone17,4" not in manifest.get("SupportedProductTypes", []):
              raise SystemExit(f"{build} manifest does not support iPhone17,4")
          out = Path("manifests") / f"{build}-BuildManifest.plist"
          out.write_bytes(raw)
          report = {
              "build": build, "product_version": version, "product_type": "iPhone17,4",
              "ipsw_file": str(image), "ipsw_size_bytes": image.stat().st_size,
              "ipsw_sha256": digest, "catalog_sha256_match": True,
              "manifest_size_bytes": len(raw), "manifest_sha256": hashlib.sha256(raw).hexdigest(),
              "manifest_supported_product_types": manifest["SupportedProductTypes"],
              "manifest_build_identity_count": len(manifest.get("BuildIdentities", [])),
          }
          Path("diagnostics", f"{build}-restore-verification.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
          done

      - name: Extract both dyld caches from their verified local restore images
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p out/cache-23G83 out/cache-23G90
          for build in 23G83 23G90; do
            image="$(find "out/$build" -type f -name '*.ipsw' -print -quit)"
            test -n "$image"
            ipsw extract --dyld --dyld-arch arm64e --device iPhone17,4 --output "out/cache-$build" "$image" 2>&1 | tee "diagnostics/$build-local-dyld-extraction.log"
            cache="$(find "out/cache-$build" -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
            test -n "$cache"
            echo "$build local_dyld_cache=$cache" | tee -a diagnostics/local-cache-paths.txt
          done

      - name: Compare CoreGraphics extracted from both local restore images
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cache83="$(find out/cache-23G83 -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          cache90="$(find out/cache-23G90 -type f -name 'dyld_shared_cache_arm64e' -print -quit)"
          python3 research/scripts/compare_coregraphics.py \
            --target-cache "$cache83" \
            --fixed-cache "$cache90" \
            --target-build 23G83 \
            --fixed-build 23G90 \
            --target-device iPhone17,4 \
            --fixed-device iPhone17,4 \
            --output coregraphics-23G83-vs-23G90-local-restore.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("coregraphics-23G83-vs-23G90-local-restore.json").read_text())
          target, fixed = report["target"], report["fixed_reference"]
          identical = target["sha256"] == fixed["sha256"] and target["size_bytes"] == fixed["size_bytes"]
          Path("diagnostics/local-restore-coregraphics-reconciliation.json").write_text(json.dumps({
              "schema_version": 1,
              "source": "both dyld caches extracted locally from full IPSWs whose SHA-256 matched independent firmware-catalog checksums",
              "target_23G83": target,
              "reference_23G90": fixed,
              "byte_identity_by_size_and_sha256": identical,
              "interpretation": "CoreGraphics bytes are identical across these restore images." if identical else "CoreGraphics bytes differ across these restore images.",
              "limitations": ["SHA-256 and size identity are strong byte-identity evidence; this does not verify Apple's restore authorization/signature or establish CVE reachability."]
          }, indent=2) + "\n")
          print(Path("diagnostics/local-restore-coregraphics-reconciliation.json").read_text())
          PY
          # Preserve the exact extracted Mach-O files before deleting multi-GB caches.
          # The comparison tool writes these under the JSON output stem.
          mkdir -p verified-coregraphics/23G83 verified-coregraphics/23G90
          cp coregraphics-23G83-vs-23G90-local-restore-components/target/CoreGraphics verified-coregraphics/23G83/CoreGraphics
          cp coregraphics-23G83-vs-23G90-local-restore-components/fixed/CoreGraphics verified-coregraphics/23G90/CoreGraphics
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          record = {}
          for build in ("23G83", "23G90"):
              binary = Path("verified-coregraphics") / build / "CoreGraphics"
              digest = hashlib.sha256(binary.read_bytes()).hexdigest()
              record[build] = {"size_bytes": binary.stat().st_size, "sha256": digest}
          report = json.loads(Path("coregraphics-23G83-vs-23G90-local-restore.json").read_text())
          assert record["23G83"]["sha256"] == report["target"]["sha256"]
          assert record["23G90"]["sha256"] == report["fixed_reference"]["sha256"]
          Path("verified-coregraphics", "checksums.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
          rm -rf out

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coregraphics-local-restore-reconciliation
          path: |
            diagnostics/
            manifests/
            verified-coregraphics/
            coregraphics-23G83-vs-23G90-local-restore.json
          if-no-files-found: warn
          retention-days: 30
