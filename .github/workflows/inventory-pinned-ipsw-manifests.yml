name: Inventory pinned IPSW manifests

on:
  workflow_dispatch:
  push:
    branches:
      - research/run-manifest-inventory

permissions:
  contents: read

jobs:
  inventory:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Target iOS 26.6.1 build 23G83
            artifact_name: target-23G83
            url: https://updates.cdn-apple.com/2026SummerFCS/fullrestores/140-75160/D83A8969-3179-4D59-9F72-37FFC825CD9A/iPhone17,4_26.6.1_23G83_Restore.ipsw
            sha256: 101aed9c3d5513b598a2b22da7bda5843a051adbe0430f23faed546c1613bd0f
            expected_size: "11225458130"
          - label: Fixed comparison iOS 27.0 build 24A437
            artifact_name: fixed-24A437
            url: https://updates.cdn-apple.com/2026FallFCS/601712cb-7aa9-4914-b421-91d45da959e6/iPhone17%2C4_27.0_24A437_Restore.ipsw
            sha256: a8bed747c08709a63e5b9d55fa87bfca2839245f91a82082a8c30b8833fae149
            expected_size: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space for the large IPSW
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Resolve expected size
        id: size
        env:
          IPSW_URL: ${{ matrix.url }}
          PINNED_SIZE: ${{ matrix.expected_size }}
        run: |
          set -euo pipefail
          if [ -n "$PINNED_SIZE" ]; then
            echo "expected=$PINNED_SIZE" >> "$GITHUB_OUTPUT"
          else
            head_size="$(curl -fsSI --location --retry 3 --connect-timeout 30 "$IPSW_URL" | awk 'tolower($1) == "content-length:" { gsub("\\r", "", $2); value=$2 } END { print value }')"
            echo "expected=$head_size" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pinned firmware to ephemeral runner
        env:
          IPSW_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 21600 "$IPSW_URL" -o "$RUNNER_TEMP/firmware.ipsw"
          df -h "$RUNNER_TEMP"
          stat -c 'Downloaded bytes: %s' "$RUNNER_TEMP/firmware.ipsw"

      - name: Verify full-file digest and inventory BuildManifest metadata
        env:
          PINNED_SHA256: ${{ matrix.sha256 }}
          EXPECTED_SIZE: ${{ steps.size.outputs.expected }}
          IPSW_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          actual_size="$(stat -c%s "$RUNNER_TEMP/firmware.ipsw")"
          if [ -n "$EXPECTED_SIZE" ] && [ "$actual_size" != "$EXPECTED_SIZE" ]; then
            echo "Content-Length mismatch: expected $EXPECTED_SIZE bytes, got $actual_size" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/inventory"
          python research/scripts/inventory_ipsw_manifest.py "$RUNNER_TEMP/firmware.ipsw" \
            --sha256 "$PINNED_SHA256" \
            --size "$actual_size" \
            --product-type iPhone17,4 \
            --output "$RUNNER_TEMP/inventory/$IPSW_NAME.json"
          python - "$RUNNER_TEMP/inventory/$IPSW_NAME.json" "$IPSW_NAME" "${{ matrix.url }}" <<'PY'
          import json, pathlib, sys
          path, label, url = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          data = json.loads(path.read_text(encoding="utf-8"))
          data["source_url"] = url
          data["artifact_label"] = label
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          sha256sum "$RUNNER_TEMP/firmware.ipsw"
          rm -f "$RUNNER_TEMP/firmware.ipsw"

      - name: Upload manifest-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: ipsw-manifest-${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/inventory/${{ matrix.artifact_name }}.json
          if-no-files-found: error
          retention-days: 14
