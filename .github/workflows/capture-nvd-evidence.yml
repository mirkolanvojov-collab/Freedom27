name: Capture NVD configuration evidence

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/capture-nvd-evidence.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture NVD CVE and CPE Match JSON
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python research/scripts/capture_nvd_configurations.py
      - name: Upload raw NVD evidence even if some requests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freedom27-nvd-capture
          path: research/nvd_api_capture/
          if-no-files-found: warn
          retention-days: 14
