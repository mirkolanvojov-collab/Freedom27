name: Probe 23G83 restore source metadata
on:
  workflow_dispatch:
  push:
    branches: [research/cve-source-reconciliation-2026-10-24]
    paths: [.github/workflows/probe-23g83-restore-source.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check exact source URL and HTTP metadata without downloading firmware
        shell: bash
        run: |
          set -euo pipefail
          url='https://updates.cdn-apple.com/2026SummerFCS/fullrestores/140-75160/D83A8969-3179-4D59-9F72-37FFC825CD9A/iPhone17,4_26.6.1_23G83_Restore.ipsw'
          expected_bytes=11225458130
          expected_sha256=101aed9c3d5513b598a2b22da7bda5843a051adbe0430f23faed546c1613bd0f
          python - <<'PY'
          from urllib.parse import urlsplit
          u='https://updates.cdn-apple.com/2026SummerFCS/fullrestores/140-75160/D83A8969-3179-4D59-9F72-37FFC825CD9A/iPhone17,4_26.6.1_23G83_Restore.ipsw'
          p=urlsplit(u)
          assert p.scheme=='https' and p.hostname=='updates.cdn-apple.com'
          assert p.path.endswith('/iPhone17,4_26.6.1_23G83_Restore.ipsw')
          PY
          curl --fail --silent --show-error --location --retry 2 --max-time 120 --head --dump-header headers.txt --output /dev/null "$url"
          python - <<'PY'
          from pathlib import Path
          raw=Path('headers.txt').read_text()
          blocks=[b for b in raw.replace('\r','').split('\n\n') if b.strip().startswith('HTTP/')]
          if not blocks: raise SystemExit('No HTTP response')
          lines=blocks[-1].splitlines()
          status=int(lines[0].split()[1])
          h=dict(line.split(':',1) for line in lines[1:] if ':' in line)
          h={k.lower().strip():v.strip() for k,v in h.items()}
          length=h.get('content-length')
          print(f'http_status={status}')
          print(f'content_length={length or "not_advertised"}')
          print('catalog_expected_bytes=11225458130')
          print('catalog_sha256=101aed9c3d5513b598a2b22da7bda5843a051adbe0430f23faed546c1613bd0f')
          print('verification_scope=source_reachability_and_http_metadata_only; no download, hash, manifest, cache extraction or authenticity check')
          if status != 200: raise SystemExit(f'Unexpected HTTP status {status}')
          if length and int(length)!=11225458130: raise SystemExit('Content-Length differs from catalog')
          Path('23G83-source-probe.txt').write_text('\n'.join([f'http_status={status}',f'content_length={length or "not_advertised"}','catalog_expected_bytes=11225458130','catalog_sha256=101aed9c3d5513b598a2b22da7bda5843a051adbe0430f23faed546c1613bd0f','verification_scope=HTTP metadata only; no firmware bytes hashed'])+'\n')
          PY
      - name: Preserve source-probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 23G83-source-probe
          path: |
            headers.txt
            23G83-source-probe.txt
          if-no-files-found: warn
