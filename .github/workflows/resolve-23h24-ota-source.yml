name: Resolve 23H24 OTA source metadata

on:
  workflow_dispatch:
  push:
    branches:
      - research/cve-source-reconciliation-2026-10-24
    paths:
      - .github/workflows/resolve-23h24-ota-source.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Query OTA sources for exact device and build
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm blacktop/ipsw:latest download ota --platform ios --device iPhone17,4 --build 23H24 --urls > ota-candidates.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          expected = "9fa3dca87b9d18a7329eada91fcd038086f20c37e1aed47f8735f0970b27cd14.aea"
          candidates = [s.strip() for s in Path("ota-candidates.txt").read_text().splitlines() if s.strip().startswith("https://")]
          results = []
          for url in candidates:
              parsed = urlparse(url)
              if parsed.hostname != "updates.cdn-apple.com":
                  continue
              name = unquote(parsed.path.rsplit("/", 1)[-1])
              results.append({"filename": name, "filename_matches_download": name == expected,
                              "url_sha256": hashlib.sha256(url.encode()).hexdigest(),
                              "host": parsed.hostname})
          report = {"device": "iPhone17,4", "requested_build": "23H24",
                    "expected_local_filename": expected, "apple_cdn_candidates": results,
                    "exact_filename_found": any(r["filename_matches_download"] for r in results),
                    "status": "metadata_only_no_firmware_download_or_extraction"}
          Path("23H24-ota-source-report.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          if not results:
              raise SystemExit("No Apple CDN URLs discovered; check report/logs before proceeding.")
          PY
      - name: Upload source metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-source-metadata-iPhone17-4-23H24
          path: 23H24-ota-source-report.json
          if-no-files-found: warn
